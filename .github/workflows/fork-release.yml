name: Fork Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  packages: write
concurrency:
  group: fork-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'liu-zhengdong/fast-note-sync-service'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Test and build release archives
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          REVISION="$(git rev-parse HEAD)"
          go test ./...
          mkdir -p build/archives
          for PLATFORM in linux_amd64 linux_arm64 linux_arm darwin_amd64 darwin_arm64 windows_amd64; do
            OS="${PLATFORM%_*}"
            ARCH="${PLATFORM#*_}"
            mkdir -p "build/$PLATFORM"
            BIN=fast-note-sync-service
            if [ "$OS" = windows ]; then BIN="$BIN.exe"; fi
            CGO_ENABLED=0 GOOS="$OS" GOARCH="$ARCH" GOARM=7 go build -trimpath -ldflags "-s -w -X github.com/haierkeys/fast-note-sync-service/internal/app.Version=$VERSION -X github.com/haierkeys/fast-note-sync-service/internal/app.GitTag=$REVISION -X github.com/haierkeys/fast-note-sync-service/internal/app.BuildTime=$BUILD_DATE" -o "build/$PLATFORM/$BIN" .
            ASSET_ARCH="$ARCH"
            if [ "$ARCH" = arm ]; then ASSET_ARCH=armv7l; fi
            tar -czf "build/archives/fast-note-sync-service-$GITHUB_REF_NAME-$OS-$ASSET_ARCH.tar.gz" config -C "build/$PLATFORM" .
          done
          git log -1 --pretty=%B > build/archives/changelog.txt
          (cd build/archives && sha256sum *.tar.gz > SHA256SUMS)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$BUILD_DATE" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/liu-zhengdong/fast-note-sync-service:${{ env.VERSION }}
            ghcr.io/liu-zhengdong/fast-note-sync-service:latest
          build-args: |
            VERSION=${{ env.VERSION }}
            BUILD_DATE=${{ env.BUILD_DATE }}
            GIT_COMMIT=${{ github.sha }}
      - name: Publish release after image succeeds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" build/archives/* --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
